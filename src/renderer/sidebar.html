<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'" />
    <title>Social Hub</title>
    <link rel="stylesheet" href="sidebar.css" />
  </head>
  <body>
    <nav id="platforms"></nav>
    <div class="spacer"></div>
    <nav id="tools">
      <button id="open-link" title="Open link from clipboard (⌘L) — or drop a link here">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.5 1.5" />
          <path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.5-1.5" />
        </svg>
      </button>
      <button id="open-config" title="Edit config (friends, X list, allowlist)">⚙</button>
      <button id="open-log" title="Blocked pages log">☰</button>
      <button id="relaunch" title="Restart to apply config">↻</button>
    </nav>
    <script src="sidebar.js"></script>
  </body>
</html>
