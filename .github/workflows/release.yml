# Every push to main (a merged PR) builds Social Hub, Developer ID signed and
# notarized, and publishes it as a GitHub Release here. Installed apps check
# these releases (latest-mac.yml) and update themselves (src/main/updater.ts).
#
# Version: major.minor from package.json + this workflow's run number, e.g.
# 0.1.17. Bump major/minor in package.json by hand when it matters.
name: Release

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

# Queued, never cancelled: each run publishes its own version.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    permissions:
      # Tagging the version and publishing the release.
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run typecheck
      - id: version
        run: |
          version="$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')").$GITHUB_RUN_NUMBER"
          npm version --no-git-tag-version --allow-same-version "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release $version from ${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"
      # notarytool takes the App Store Connect API key as a file.
      - run: echo "$KEY" > "$RUNNER_TEMP/AuthKey.p8"
        env:
          KEY: ${{ secrets.APPLE_API_KEY }}
      # electron-builder signs with CSC_LINK (imported into a temporary
      # keychain) and, since the APPLE_API_* vars are set, notarizes and
      # staples the app.
      - run: npm run dist
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      # electron-builder only notarizes the app inside the dmg. Stapling the dmg
      # too lets Gatekeeper accept the download without a network check. Its
      # hash in latest-mac.yml goes stale, which is fine: updates use the zip.
      - name: Notarize and staple the dmg
        env:
          DMG: release/Social-Hub-${{ steps.version.outputs.version }}-arm64.dmg
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          xcrun notarytool submit "$DMG" --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$DMG"
      - name: Check Gatekeeper accepts it
        run: |
          spctl --assess --type execute -vv "release/mac-arm64/Social Hub.app"
          spctl --assess --type open --context context:primary-signature -vv release/*.dmg
          xcrun stapler validate release/*.dmg
      - run: rm -f "$RUNNER_TEMP/AuthKey.p8"
        if: always()
      # gh uploads every file before publishing, so apps never see a
      # latest-mac.yml whose zip isn't there yet. It also creates the tag.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            release/Social-Hub-*-arm64.dmg \
            release/Social-Hub-*-arm64.zip \
            release/Social-Hub-*-arm64.zip.blockmap \
            release/latest-mac.yml \
            --latest --target "$GITHUB_SHA" \
            --title "Social Hub $VERSION" \
            --notes "Notarized build of ${GITHUB_SHA::7}. Download **Social-Hub-$VERSION-arm64.dmg** (Apple silicon). Installed copies update themselves."
