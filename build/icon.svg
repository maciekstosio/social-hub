<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a33"/>
      <stop offset="1" stop-color="#111114"/>
    </linearGradient>
    <linearGradient id="ig" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#f58529"/>
      <stop offset="0.5" stop-color="#dd2a7b"/>
      <stop offset="1" stop-color="#8134af"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824px body inside a 1024px canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
  <!-- Chat bubble -->
  <path filter="url(#shadow)" fill="#f4f4f7"
        d="M512 250c-171 0-300 104-300 240 0 74 38 140 100 184-6 42-26 86-62 122 70 0 132-24 176-58 28 6 56 10 86 10 171 0 300-104 300-258S683 250 512 250z"/>
  <!-- One dot per platform -->
  <circle cx="392" cy="500" r="50" fill="url(#ig)"/>
  <circle cx="512" cy="500" r="50" fill="#1877f2"/>
  <circle cx="632" cy="500" r="50" fill="#111114"/>
</svg>
